kind = "web"
previewPath = "/"
title = "Misfits"
version = "1.0.0"
id = "artifacts/misfits"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22662

[services.development]
run = "pnpm --filter @workspace/misfits run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/misfits", "run", "build" ]
publicDir = "artifacts/misfits/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22662"
BASE_PATH = "/"
